<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <!-- Header / Balance -->
    <header class="header">
      <h1 class="app-title">💰 Budget Tracker</h1>
      <div class="balance-card">
        <p class="balance-label">Total Balance</p>
        <p class="balance-amount" id="total-balance">Rp 0</p>
      </div>
    </header>

    <!-- Input Form -->
    <section class="form-card">
      <h2 class="section-title">Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <div class="form-group">
          <label for="item-name">Item Name</label>
          <input
            type="text"
            id="item-name"
            placeholder="e.g. Lunch, Bus ticket…"
            autocomplete="off"
          />
          <span class="field-error" id="error-name"></span>
        </div>

        <div class="form-group">
          <label for="item-amount">Amount</label>
          <input
            type="number"
            id="item-amount"
            placeholder="e.g. 25000"
            min="1"
          />
          <span class="field-error" id="error-amount"></span>
        </div>

        <div class="form-group">
          <label for="item-category">Category</label>
          <select id="item-category">
            <option value="">-- Select category --</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="field-error" id="error-category"></span>
        </div>

        <button type="submit" class="btn-add">Add Transaction</button>
      </form>
    </section>

    <!-- Chart Section -->
    <section class="chart-card">
      <h2 class="section-title">Spending by Category</h2>
      <div class="chart-wrapper">
        <canvas id="spending-chart"></canvas>
        <p class="chart-empty" id="chart-empty">No transactions yet. Add one to see the chart!</p>
      </div>
    </section>

    <!-- Transaction List -->
    <section class="list-card">
      <h2 class="section-title">Transactions</h2>
      <div class="transaction-list" id="transaction-list">
        <p class="empty-state" id="empty-state">No transactions yet. Start by adding one above!</p>
      </div>
    </section>

  </div>

  <!-- Chart.js from CDN — must load before app.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="app.js"></script>
</body>
</html>
